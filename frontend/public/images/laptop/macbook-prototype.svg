<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" role="img" aria-label="MacBook Pro prototype illustration">
  <defs>
    <linearGradient id="mac-screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#2d3748"/>
      <stop offset="50%" stop-color="#1a202c"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="mac-body" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#d1d5db"/>
      <stop offset="50%" stop-color="#9ca3af"/>
      <stop offset="100%" stop-color="#6b7280"/>
    </linearGradient>
  </defs>
  <ellipse cx="440" cy="540" rx="340" ry="40" fill="#94a3b8" opacity=".2"/>
  <!-- Screen Lid -->
  <rect x="180" y="80" width="520" height="340" rx="20" fill="#1e293b" stroke="#cbd5e1" stroke-width="6"/>
  <rect x="195" y="95" width="490" height="310" rx="12" fill="url(#mac-screen)"/>
  <!-- Display Graphic Content -->
  <path d="M220 320 Q 340 180, 440 280 T 660 160" stroke="#38bdf8" stroke-width="12" fill="none" opacity=".8"/>
  <path d="M220 350 Q 360 220, 480 320 T 660 210" stroke="#818cf8" stroke-width="8" fill="none" opacity=".6"/>
  <circle cx="440" cy="90" r="4" fill="#64748b"/>
  <!-- Base Chassis -->
  <path d="M120 420 L760 420 L720 460 L160 460 Z" fill="url(#mac-body)" stroke="#9ca3af" stroke-width="4"/>
  <rect x="380" y="420" width="120" height="8" rx="4" fill="#64748b"/>
</svg>
