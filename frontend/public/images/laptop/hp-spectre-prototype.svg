  <path d="M230 310 Q 360 160, 470 290 T 650 170" stroke="#818cf8" stroke-width="14" fill="none" opacity=".85"/>
  <circle cx="440" cy="88" r="3" fill="#94a3b8"/>
  <!-- Base Chassis with Brass/Gem Accents -->
  <path d="M120 420 L760 420 L730 460 L150 460 Z" fill="url(#hp-body)" stroke="#d97706" stroke-width="3"/>
  <rect x="370" y="420" width="140" height="6" rx="3" fill="#d97706"/>
