<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 620" role="img" aria-label="Dell XPS prototype illustration">
  <defs>
    <linearGradient id="dell-screen" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="dell-body" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#cbd5e1"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
  </defs>
  <ellipse cx="440" cy="540" rx="340" ry="40" fill="#0284c7" opacity=".18"/>
  <!-- Ultra-thin Screen Lid -->
  <rect x="180" y="80" width="520" height="340" rx="14" fill="#0f172a" stroke="#e2e8f0" stroke-width="4"/>
  <rect x="186" y="86" width="508" height="328" rx="8" fill="url(#dell-screen)"/>
  <!-- InfinityEdge visual -->
  <path d="M220 300 C 350 150, 420 400, 660 140" stroke="#38bdf8" stroke-width="16" fill="none" opacity=".85"/>
  <circle cx="440" cy="84" r="3" fill="#94a3b8"/>
  <!-- Base Chassis -->
  <path d="M120 420 L760 420 L730 460 L150 460 Z" fill="url(#dell-body)" stroke="#cbd5e1" stroke-width="3"/>
  <rect x="370" y="420" width="140" height="6" rx="3" fill="#64748b"/>
</svg>
